project:
  type: website
  pre-render: panelize-code-cells-for-quarto-webr.R

website:
  title: "$ALTDOC_PACKAGE_NAME v$ALTDOC_PACKAGE_VERSION"
  navbar:
    search: true
    right:
      - icon: github
        href: $ALTDOC_PACKAGE_URL_GITHUB
        aria-label: $ALTDOC_PACKAGE_NAME GitHub
  sidebar:
    collapse-level: 1
    contents:
      - text: Home
        file: index.md
      - section: $ALTDOC_VIGNETTE_BLOCK
      - section: $ALTDOC_MAN_BLOCK
      - text: News
        file: $ALTDOC_NEWS
      - text: Changelog
        file: $ALTDOC_CHANGELOG
      - text: License
        file: $ALTDOC_LICENSE
      - text: Licence
        file: $ALTDOC_LICENCE
      - text: Code of conduct
        file: $ALTDOC_CODE_OF_CONDUCT
      - text: Citation
        file: $ALTDOC_CITATION
# Add custom repository registration
webr:
  # Must match the R version the WASM binaries are built for (see the
  # rwasmbuild job in .github/workflows/altdoc.yaml, currently webr:main
  # which builds against R 4.6.0 -> bin/emscripten/contrib/4.6). Without
  # this pin the extension defaults to an old webR release whose R version
  # doesn't match, so package installs 404 against the wrong contrib path.
  version: "0.6.0"
  packages: ['$ALTDOC_PACKAGE_NAME']
  repos:
    - $ALTDOC_PACKAGE_URL

# Attach extensions
filters:
- panelize
- webr

